services:
  - type: web
    name: parpas-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run seed:demo && npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DEV_AUTH_BYPASS
        value: "false"
      - key: PYTHON_PREDICTIVE_BASE
        sync: false

  - type: web
    name: parpas-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
